version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: archon-marketplace-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: archon-marketplace-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL}
    container_name: archon-marketplace-frontend
    ports:
      - "5175:3000"
    depends_on:
      - db
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: archon-marketplace-backend
    ports:
      - "3000:4000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - BACKEND_URL=${BACKEND_URL}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
    depends_on:
      - db

  sync-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: sync-worker
    container_name: archon-marketplace-sync-worker
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    depends_on:
      - db

volumes:
  postgres_data:
