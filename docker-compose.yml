version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: archon-marketplace-db
    restart: always
    environment:
      POSTGRES_USER: archon
      POSTGRES_PASSWORD: password
      POSTGRES_DB: archon_marketplace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: archon-marketplace-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@archon.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        PUBLIC_API_URL: http://localhost:3000
    container_name: archon-marketplace-frontend
    ports:
      - "5175:3000"
    depends_on:
      - db
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: archon-marketplace-backend
    ports:
      - "3000:4000"
    environment:
      - DATABASE_URL=postgresql://archon:password@db:5432/archon_marketplace
    depends_on:
      - db

  sync-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: sync-worker
    container_name: archon-marketplace-sync-worker
    environment:
      - DATABASE_URL=postgresql://archon:password@db:5432/archon_marketplace
    depends_on:
      - db

volumes:
  postgres_data:
